# The workflow's own `name:` here MUST equal `checks.ci_workflow` in
# board.toml, and the one job below MUST be named exactly what
# `checks.required` lists. A mismatch on either is the failure mode where a
# board waits forever for a check that will never report -- silently, because
# waiting looks identical to running. See board.toml's [checks] table.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: tests/run-all.sh
