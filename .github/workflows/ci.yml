# The workflow's own `name:` here MUST equal `checks.ci_workflow` in
# board.toml, and the one job below MUST be named exactly what
# `checks.required` lists. A mismatch on either is the failure mode where a
# board waits forever for a check that will never report -- silently, because
# waiting looks identical to running. See board.toml's [checks] table.
name: CI

# Runs on GitHub-hosted runners, and must keep doing so while this repository
# is public.
#
# This job previously ran on a self-hosted runner on the maintainer's own
# machine, to dodge a GitHub billing lapse. That is safe only while a
# repository is private. `pull_request` builds the contributor's branch, and
# `tests/run-all.sh` is a file in that branch -- so on a public repository a
# self-hosted runner executes a stranger's code as the user that owns the
# host's gh token, its Claude sessions, and every board instance under
# ~/.foreman. GitHub's "require approval for first-time contributors" default
# does not close this: it gates a contributor's FIRST pull request only, and
# every later one from the same account runs unapproved. The trust boundary
# here is review, and CI runs before review.
#
# So: do not reintroduce `self-hosted` while this repository is public, and if
# it is ever made private again, weigh that against the fork it may have by
# then. preflight.py's "a runner is online" check needs nothing here -- it
# reads the repository's registered runner list and treats an empty one as a
# pass, because a repository on hosted runners has nothing for this machine to
# be wrong about.
#
# The billing lapse that drove the move is still a real failure mode, and now
# there is no self-hosted fallback behind it. A lapse stops hosted jobs dead:
# they conclude `failure` in three seconds with no steps and no log, which the
# board reads as an ordinary red build. The two runs on `main` of 2026-09-04
# and 2026-09-05 did exactly that, each annotated "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased". A red build here with no steps means check the account before
# reading the diff.
#
# What a change here has to preserve:
#
#   - The Tests step pins HOME to the job's scratch directory. tests/ already
#     builds a throwaway HOME per test through tests/lib/instance-fixture.sh
#     and stubs `gh`, `claude` and `systemctl` on PATH; this is the backstop
#     for a test that forgets the fixture. A hosted runner is thrown away
#     anyway, but the same suite runs on contributors' own machines, where it
#     is the difference between a scratch directory and their live ~/.foreman.
#     The suite passes under that HOME; keep it so.
#   - Every action stays pinned to a commit rather than a moving major tag.
#   - Checkout leaves no token in the workspace. A public repository's
#     workflow file is readable by anyone deciding what to try.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run every test under a scratch HOME
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          tests/run-all.sh
